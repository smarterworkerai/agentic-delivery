name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify tag, generated package, and release index
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(<VERSION)
          test "${RELEASE_TAG}" = "v${version}"
          python3 tools/build_skills.py --check
          python3 - "$version" <<'PY'
          import json, sys
          from pathlib import Path
          version = sys.argv[1]
          releases = json.loads(Path("releases/adw-mise-v2.json").read_text())["releases"]
          assert any(item["version"] == version for item in releases), f"release index lacks {version}"
          PY
      - name: Build release artifacts and notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(<VERSION)
          archive="agentic-delivery-skills-${version}.tar.gz"
          tar -czf "$archive" skills/adw LICENSE
          sha256sum "$archive" > SHA256SUMS
          curl -fsSL --retry 3 "https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}" -o source.tar.gz
          source_sha=$(sha256sum source.tar.gz | cut -d' ' -f1)
          python3 tools/release_notes.py "$version" > release-notes.md
          printf '\n## Hermes install\n\n```bash\nADW_REF=%s ADW_ARCHIVE_SHA256=%s bash -c "$(curl -fsSL https://raw.githubusercontent.com/%s/%s/integrations/hermes/install_adw.sh)"\n```\n' "$GITHUB_SHA" "$source_sha" "$GITHUB_REPOSITORY" "$GITHUB_SHA" >> release-notes.md
          gh release create "$GITHUB_REF_NAME" "$archive" SHA256SUMS --title "$GITHUB_REF_NAME" --notes-file release-notes.md
