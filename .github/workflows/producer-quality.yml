name: Producer quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: producer-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  required-quality:
    name: Required producer quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run portable producer quality graph
        run: python3 tools/verify_producer.py
